function buildTargetAchieveChart(monthsData, opts){
  opts = opts || {};
  const w = 1220, h = 280, padL = 54, padR = 16, padT = 40, padB = 34;
  const iw = w-padL-padR, ih = h-padT-padB;
  const maxVal = Math.max(...monthsData.map(m=>Math.max(m.target,m.achieved)), 0.01);
  const n = monthsData.length;
  const groupW = iw/n;
  const barW = Math.min(groupW*0.4, 40);
  const MIN_LABEL_BAR_H = 22; // bars shorter than this can't fit an inside label — falls back to an above-bar label instead

  let gridLines = '';
  for(let g=0; g<=4; g++){
    const y = padT + (ih/4)*g;
    const val = maxVal - (maxVal/4)*g;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--line-soft)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" font-family="IBM Plex Mono, monospace" fill="var(--muted)">₹${fmtCr(val)}</text>`;
  }

  function valueLabel(x, topY, barH, text, insideColor, outsideColor){
    if(barH >= MIN_LABEL_BAR_H){
      return `<text x="${x.toFixed(1)}" y="${(topY+15).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="600" font-family="IBM Plex Mono, monospace" fill="${insideColor}">${text}</text>`;
    }
    return `<text x="${x.toFixed(1)}" y="${(topY-6).toFixed(1)}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="${outsideColor}">${text}</text>`;
  }

  let bars = '', labels = '', valueLabels = '', linePts = [];
  monthsData.forEach((m,i) => {
    const cx = padL + groupW*i + groupW/2;
    const tH = (m.target/maxVal)*ih, aH = (m.achieved/maxVal)*ih;
    const tX = cx - barW - 2, aX = cx + 2;
    const tTopY = padT+ih-tH;
    bars += `<rect x="${tX}" y="${tTopY}" width="${barW}" height="${Math.max(tH,1)}" rx="3" fill="var(--navy)"><title>${m.label} Target: ₹${fmtCr(m.target)} Cr</title></rect>`;
    valueLabels += valueLabel(tX+barW/2, tTopY, tH, '₹'+fmtCr(m.target,1), '#FFFFFF', 'var(--navy)');
    if(m.hasAchieved){
      const aTopY = padT+ih-aH;
      bars += `<rect x="${aX}" y="${aTopY}" width="${barW}" height="${Math.max(aH,1)}" rx="3" fill="var(--teal)"><title>${m.label} Achieved: ₹${fmtCr(m.achieved)} Cr</title></rect>`;
      valueLabels += valueLabel(aX+barW/2, aTopY, aH, '₹'+fmtCr(m.achieved,1), '#FFFFFF', 'var(--up)');
      linePts.push({ x: cx, y: aTopY });
    }
    labels += `<text x="${cx}" y="${h-10}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace" fill="var(--muted)">${m.label}</text>`;
  });
  const linePath = linePts.map((p,i) => (i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const lineDots = linePts.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--purple)" stroke="#fff" stroke-width="1.5"/>`).join('');

  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible">
    ${gridLines}${bars}${valueLabels}
    <path d="${linePath}" fill="none" stroke="var(--purple)" stroke-width="2.5" stroke-dasharray="5 3"/>
    ${lineDots}${labels}
  </svg>`;
}

function buildAopAnalysisCore(dataRows, targetRecordsAllRaw, targetRef, selType, selPlatform, tableMode, comboSort, priorFY, fyLabel){
  // Target records have Platform/AOP Div/Portfolio dimensions natively, so those filters apply directly.
  // KAM and Portal Type have no native field on a target record, so they're derived via the same
  // platform-attribution used everywhere else in the dashboard, so filtering by KAM/Portal Type
  // narrows the Target side consistently too — this was a real gap before.
  let targetRecordsAll = targetRecordsAllRaw;
  if(filters.portal.length) targetRecordsAll = targetRecordsAll.filter(rec => filters.portal.includes(rec.platform));
  if(filters.aopDiv.length) targetRecordsAll = targetRecordsAll.filter(rec => filters.aopDiv.includes(rec.aopDiv));
  if(filters.aopPort.length) targetRecordsAll = targetRecordsAll.filter(rec => filters.aopPort.includes(rec.aopPort));
  if(filters.kam.length) targetRecordsAll = targetRecordsAll.filter(rec => filters.kam.includes(getPlatformKAM(rec.platform)));
  if(filters.portalType.length) targetRecordsAll = targetRecordsAll.filter(rec => filters.portalType.includes(getPlatformPortalType(rec.platform)));

  const achievedRowsAll = achievedRowsForFY(applyDimFilters(dataRows), targetRef.refDate, tableMode);
  const monthsElapsed = FY_MONTH_ORDER.indexOf(targetRef.refMonth) + 1;
  const remainingMonths = 12 - monthsElapsed;

  // ---- Scope resolution: Overall / Portal Type / specific Platform ----
  function scopeAchieved(rows){
    if(selPlatform) return rows.filter(r => r.portal === selPlatform);
    if(selType) return rows.filter(r => getPlatformPortalType(r.portal) === selType);
    return rows;
  }
  function scopeTargetRecords(){
    if(selPlatform) return targetRecordsAll.filter(rec => rec.platform === selPlatform);
    if(selType) return targetRecordsAll.filter(rec => getPlatformPortalType(rec.platform) === selType);
    return targetRecordsAll;
  }

  const achievedRows = scopeAchieved(achievedRowsAll);
  const targetRecords = scopeTargetRecords();
  const grandAchieved = sumField(achievedRows, 'value');
  const grandTarget = targetSum(targetRecords, targetRef.refMonth, tableMode);
  const grandGap = grandAchieved - grandTarget;
  const achievedPct = grandTarget ? grandAchieved/grandTarget*100 : null;

  // Prior-FY YoY, same relative period (cumulative-so-far for YTD, exact same single month for MTD)
  const priorFYRows = dataRows.filter(r => getFY(r.date) === priorFY);
  const priorScoped = scopeAchieved(applyDimFilters(priorFYRows)).filter(r => {
    const rMonthIdx = FY_MONTH_ORDER.indexOf(parseInt(r.date.slice(5,7),10));
    return tableMode === 'mtd' ? rMonthIdx === (monthsElapsed-1) : rMonthIdx < monthsElapsed;
  });
  const priorAchieved = sumField(priorScoped, 'value');
  const yoyPct = priorAchieved ? (grandAchieved-priorAchieved)/priorAchieved*100 : null;

  const currentRunRate = monthsElapsed ? grandAchieved/monthsElapsed : 0;
  const fyAnnualTarget = targetSum(targetRecords, 3, 'ytd'); // full FY target, regardless of YTD/MTD toggle
  // Required Monthly DRR = the TOTAL average monthly rate needed for the *remaining* months to still
  // hit the FULL annual target — not just "catch-up to today's prorated pace". E.g. full-year target 120,
  // 8 months in with 40 achieved so far, 4 months left: (120-40)/4 = 30/mo required for the rest of the year.
  const remainingTarget = Math.max(fyAnnualTarget - grandAchieved, 0);
  const requiredRunRate = remainingMonths > 0 ? remainingTarget/remainingMonths : 0;
  const pacePct = requiredRunRate > 0 ? (currentRunRate/requiredRunRate*100) : (grandGap>=0 ? 100 : 0);
  const yearElapsedPct = monthsElapsed/12*100;
  const projectedAchievement = currentRunRate * 12; // if current monthly pace (DRR) held for the full year
  const projectedPct = fyAnnualTarget ? projectedAchievement/fyAnnualTarget*100 : (projectedAchievement>0 ? 100 : 0);

  // ---- Monthly Target vs Achievement (always all-scope combined, per the "All platforms combined" framing) ----
  const monthsData = FY_MONTH_ORDER.map((m, i) => {
    const mm = String(m).padStart(2,'0');
    const recs = scopeTargetRecords();
    const target = recs.reduce((s,rec)=> s + (rec.monthly[String(m)]||0), 0);
    const isElapsed = i < monthsElapsed;
    const achieved = isElapsed ? sumField(achievedRows.filter(r => r.date.slice(5,7)===mm), 'value') : 0;
    return { label: MONTH_NAMES[m-1].slice(0,3), target, achieved, hasAchieved: isElapsed };
  });

  // ---- Category Contribution (share of achievement by Portal Type, now respects the current drill-down scope) ----
  const catData = groupAndRank(achievedRows, 'portalType', sumField(achievedRows,'value'))
    .filter(d=>d.name).map((d,i) => ({ ...d, color: PLATFORM_PALETTE[i % PLATFORM_PALETTE.length] }));
  const catDonut = buildFullDonutChart(catData, { centerValue:'₹'+fmtCr(sumField(achievedRows,'value'))+' Cr', centerLabel:'Total Achieved' });

  // ---- 4 scorecards: Overall + each Portal Type ----
  const allTypes = [...new Set(targetRecordsAll.map(rec => getPlatformPortalType(rec.platform)))];
  const scorecardDefs = [{ key:null, label:'Overall' }, ...allTypes.map(t => ({ key:t, label:t }))];
  const scorecardsHtml = scorecardDefs.map(sc => {
    const rows = sc.key ? achievedRowsAll.filter(r => getPlatformPortalType(r.portal)===sc.key) : achievedRowsAll;
    const recs = sc.key ? targetRecordsAll.filter(rec => getPlatformPortalType(rec.platform)===sc.key) : targetRecordsAll;
    const t = targetSum(recs, targetRef.refMonth, tableMode);
    const a = sumField(rows, 'value');
    const pct = t ? a/t*100 : null;
    const isActive = (sc.key===null && selType===null) || (sc.key===selType);
    return `
      <div class="aop-sc ${isActive?'active':''}" data-aoptype="${sc.key||''}">
        <div class="aop-sc-lbl">${sc.label}</div>
        <div class="aop-sc-pct ${pct===null?'':(pct>=100?'gap-pos':'gap-neg')}">${pct===null?'—':fmtPct(pct)}</div>
        <div class="aop-sc-sub">₹${fmtCr(a)} Cr / ₹${fmtCr(t)} Cr</div>
      </div>`;
  }).join('');

  // ---- Platform cards (only shown when a Portal Type is selected) ----
  let platformCardsHtml = '';
  if(selType){
    const platforms = [...new Set(targetRecordsAll.filter(rec => getPlatformPortalType(rec.platform)===selType).map(rec=>rec.platform))];
    platformCardsHtml = `
      <div class="aop-platform-grid">
        ${platforms.map(p => {
          const recs = targetRecordsAll.filter(rec => rec.platform===p);
          const t = targetSum(recs, targetRef.refMonth, tableMode);
          const a = sumField(achievedRowsAll.filter(r=>r.portal===p), 'value');
          const pct = t ? a/t*100 : null;
          const isActive = selPlatform === p;
          return `
            <div class="aop-plat-card ${isActive?'active':''}" data-aopplatform="${p}">
              <div class="aop-plat-name" style="display:flex; align-items:center;">${platformLabel(p)}</div>
              <div class="aop-plat-pct ${pct===null?'':(pct>=100?'gap-pos':'gap-neg')}">${pct===null?'—':fmtPct(pct)}</div>
              <div class="aop-plat-sub">₹${fmtCr(a)} / ₹${fmtCr(t)} Cr</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  // ---- AOP Div x Portfolio table — reuses the same mode-aware achievedRows/targetRecords/grandTarget/grandAchieved computed above ----
  const tableGrandAchieved = grandAchieved;
  const tableGrandTarget = grandTarget;
  const tableGrandGap = grandGap;
  const tableAchievedPct = achievedPct;

  const comboTarget = {}, comboAchieved = {};
  targetRecords.forEach(rec => {
    const key = rec.aopDiv+'|'+rec.aopPort;
    comboTarget[key] = (comboTarget[key]||0) + targetSum([rec], targetRef.refMonth, tableMode);
  });
  achievedRows.forEach(r => {
    const key = r.aopDiv+'|'+r.aopPort;
    comboAchieved[key] = (comboAchieved[key]||0) + r.value;
  });
  const comboKeys = new Set([...Object.keys(comboTarget), ...Object.keys(comboAchieved)]);
  let comboRows = [...comboKeys].map(key => {
    const [div,port] = key.split('|');
    const t = comboTarget[key]||0, a = comboAchieved[key]||0;
    return { div, port, target:t, achieved:a, gap:a-t, pct: t ? a/t*100 : null };
  });
  if(comboSort === 'name'){
    comboRows.sort((a,b) => (a.div+a.port).localeCompare(b.div+b.port));
  } else {
    comboRows.sort((a,b) => (b.target - a.target) || ((b.pct||0) - (a.pct||0)));
  }

  const scopeTitle = selPlatform ? selPlatform : (selType ? selType : 'Overall');
  const tableModeLabel = tableMode === 'mtd' ? 'MTD' : 'YTD';

  return `
    <div class="aop-kpi-grid">
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">Total AOP Target</span><span class="aop-kpi-icon" style="background:var(--purple)">◎</span></div>
        <div class="aop-kpi-value">₹${fmtCr(grandTarget)} Cr</div>
        <div class="aop-kpi-sub na">${fyLabel} Annual: ₹${fmtCr(fyAnnualTarget)} Cr</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${Math.min(yearElapsedPct,100).toFixed(0)}%; background:var(--purple);"></div></div>
        <div class="aop-kpi-caption">${fmtPct(yearElapsedPct)} of year elapsed</div>
      </div>
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">Total Achievement</span><span class="aop-kpi-icon" style="background:var(--teal)">✓</span></div>
        <div class="aop-kpi-value">₹${fmtCr(grandAchieved)} Cr</div>
        <div class="aop-kpi-sub ${yoyPct===null?'na':(yoyPct>=0?'gap-pos':'gap-neg')}">${yoyPct===null?'No prior-year data':(yoyPct>=0?'▲ +':'▼ ')+fmtPct(Math.abs(yoyPct))+' YoY'}</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${achievedPct===null?0:Math.min(achievedPct,100).toFixed(0)}%; background:var(--teal);"></div></div>
        <div class="aop-kpi-caption">${achievedPct===null?'—':fmtPct(achievedPct)} vs AOP</div>
      </div>
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">AOP Gap</span><span class="aop-kpi-icon" style="background:${grandGap>=0?'var(--up)':'#F0A623'}">${grandGap>=0?'✓':'!'}</span></div>
        <div class="aop-kpi-value ${grandGap>=0?'gap-pos':'gap-neg'}">${grandGap>=0?'+':'-'}₹${fmtCr(Math.abs(grandGap))} Cr</div>
        <div class="aop-kpi-sub na">${grandGap>=0?'Ahead of target':'Remaining to achieve'}</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${achievedPct===null?0:Math.min(achievedPct,100).toFixed(0)}%; background:${grandGap>=0?'var(--up)':'#F0A623'};"></div></div>
        <div class="aop-kpi-caption">${achievedPct===null?'—':fmtPct(Math.max(100-achievedPct,0))+' shortfall'}</div>
      </div>
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">Monthly Run Rate (DRR)</span><span class="aop-kpi-icon" style="background:var(--blue)">◷</span></div>
        <div class="aop-kpi-value">₹${fmtCr(currentRunRate)} Cr/mo</div>
        <div class="aop-kpi-sub ${pacePct>=100?'gap-pos':'gap-neg'}">Req: ₹${fmtCr(requiredRunRate)} Cr/mo</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${Math.min(pacePct,100).toFixed(0)}%; background:var(--blue);"></div></div>
        <div class="aop-kpi-caption">${fmtPct(pacePct)} of required pace</div>
      </div>
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">Projected Achievement</span><span class="aop-kpi-icon" style="background:#8E6FF0">◈</span></div>
        <div class="aop-kpi-value">₹${fmtCr(projectedAchievement)} Cr</div>
        <div class="aop-kpi-sub ${projectedPct>=100?'gap-pos':'gap-neg'}">${projectedPct>=100?'▲ On track':'▼ Below target'}</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${Math.min(projectedPct,100).toFixed(0)}%; background:#8E6FF0;"></div></div>
        <div class="aop-kpi-caption">${fmtPct(projectedPct)} of ${fyLabel} target, at current DRR</div>
      </div>
      <div class="aop-kpi-card">
        <div class="aop-kpi-top"><span class="aop-kpi-label">Required Monthly DRR</span><span class="aop-kpi-icon" style="background:#E2568C">⚑</span></div>
        <div class="aop-kpi-value">₹${fmtCr(requiredRunRate)} Cr/mo</div>
        <div class="aop-kpi-sub na">Current: ₹${fmtCr(currentRunRate)} Cr/mo</div>
        <div class="aop-progress-track"><div class="aop-progress-fill" style="width:${Math.min(pacePct,100).toFixed(0)}%; background:#E2568C;"></div></div>
        <div class="aop-kpi-caption">To hit target over ${remainingMonths>0?remainingMonths:0} remaining month(s)</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="section" style="grid-column: span 2 / span 2;">
        <div class="section-head"><h2>Monthly Target vs Achievement</h2><span class="note">All platforms combined · ${fyLabel}</span></div>
        <div class="section-sub" style="margin-top:-6px;">
          <span class="legend-swatch" style="background:var(--navy)"></span> Target
          <span class="legend-swatch" style="background:var(--teal); margin-left:14px;"></span> Achievement
          <span class="legend-swatch" style="background:var(--purple); margin-left:14px; border-radius:50%;"></span> Run Rate
        </div>
        ${buildTargetAchieveChart(monthsData)}
      </div>
    </div>
    <div class="grid-2">
      <div class="section">
        <div class="section-head"><h2>Category Contribution</h2><span class="note">Share of Achievement (YTD)</span></div>
        <div style="display:flex; justify-content:center;">${catDonut}</div>
        <div class="chart-legend">${catData.map(d=>`
          <div class="chart-legend-row">
            <span class="sw" style="background:${d.color}"></span>
            <span class="lbl">${d.name}</span>
            <span class="val">₹${fmtCr(d.value)} Cr</span>
            <span class="pct">${fmtPct(d.pct)}</span>
          </div>`).join('')}</div>
      </div>
      <div class="section">
        <div class="section-head"><h2>Drill Down</h2><span class="note">Click a category, then a platform</span></div>
        <div class="aop-sc-grid">${scorecardsHtml}</div>
        ${platformCardsHtml}
      </div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>AOP Div × AOP Portfolio — ${scopeTitle}</h2>
        <div class="mode-toggle">
          <label class="mode-radio"><input type="radio" name="aopComboSortRadio" value="target" ${comboSort==='target'?'checked':''}/> Highest Target &amp; Achievement %</label>
          <label class="mode-radio"><input type="radio" name="aopComboSortRadio" value="name" ${comboSort==='name'?'checked':''}/> Name (A–Z)</label>
        </div>
      </div>
      <div class="grand-total-bar">
        <div class="gt-item"><span class="gt-lbl">${tableModeLabel} Target</span><span class="gt-val">₹${fmtCr(tableGrandTarget)} Cr</span></div>
        <div class="gt-item"><span class="gt-lbl">${tableModeLabel} Achieved</span><span class="gt-val">₹${fmtCr(tableGrandAchieved)} Cr</span></div>
        <div class="gt-item"><span class="gt-lbl">Achieved %</span><span class="gt-val">${tableAchievedPct===null?'—':fmtPct(tableAchievedPct)}</span></div>
        <div class="gt-item"><span class="gt-lbl">Gap</span><span class="gt-val ${tableGrandGap>=0?'gap-pos':'gap-neg'}">${tableGrandGap>=0?'+':''}₹${fmtCr(tableGrandGap)} Cr</span></div>
      </div>
      <table class="mono">
        <thead><tr><th>AOP Division</th><th>AOP Portfolio</th><th class="num">Target</th><th class="num">Achieved</th><th class="num">Achieved %</th><th class="num">Gap</th></tr></thead>
        <tbody>${comboRows.map(c => `<tr>
          <td>${c.div}</td><td>${c.port}</td>
          <td class="num mono">₹${fmtCr(c.target)} Cr</td>
          <td class="num mono">₹${fmtCr(c.achieved)} Cr</td>
          <td class="num mono">${c.pct===null?'—':fmtPct(c.pct)}</td>
          <td class="num mono ${c.gap>=0?'gap-pos':'gap-neg'}">${c.gap>=0?'+':''}₹${fmtCr(c.gap)} Cr</td>
        </tr>`).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:20px;">No data</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function renderAopAnalysis(ref){
  const currentTableMode = aopAnalysisDataset === 'primary' ? aopTableMode : offtakeAopTableMode;
  const headerHtml = `
    <div class="section-head breakdown-head">
      <h2>Analysis</h2>
      <div class="dataset-toggle">
        <button class="btn ${aopAnalysisDataset==='primary'?'':'ghost'}" data-aopdataset="primary" style="${aopAnalysisDataset==='primary'?'':'border:1.5px solid var(--navy); color:var(--navy);'} padding:6px 14px; font-size:12.5px;">Primary</button>
        <button class="btn ${aopAnalysisDataset==='offtakes'?'':'ghost'}" data-aopdataset="offtakes" style="${aopAnalysisDataset==='offtakes'?'':'border:1.5px solid var(--navy); color:var(--navy);'} padding:6px 14px; font-size:12.5px;">Offtakes</button>
      </div>
      <div class="breakdown-controls">
        <div class="mode-toggle">
          <label class="mode-radio"><input type="radio" name="aopTableModeRadio" value="ytd" ${currentTableMode==='ytd'?'checked':''}/> YTD</label>
          <label class="mode-radio"><input type="radio" name="aopTableModeRadio" value="mtd" ${currentTableMode==='mtd'?'checked':''}/> MTD</label>
        </div>
      </div>
    </div>
  `;

  if(aopAnalysisDataset === 'primary'){
    const targetRef = getTargetReferenceMonth(allRows);
    if(!targetRef){
      return headerHtml + `<div class="section"><div class="empty"><h3>No FY2026-27 data yet</h3><p>Upload a report dated within FY2026-27 (April 2026 onward) to see AOP Analysis.</p></div></div>`;
    }
    return headerHtml + buildAopAnalysisCore(allRows, EMBEDDED_AOP_TARGET, targetRef, aopSelectedType, aopSelectedPlatform, aopTableMode, aopComboSort, 'FY2025-26', 'FY2026-27');
  } else {
    const targetRef = getTargetReferenceMonth(offtakeAllRows);
    if(!targetRef){
      return headerHtml + `<div class="section"><div class="empty"><h3>No FY2026-27 offtake data yet</h3><p>Offtake data dated within FY2026-27 (April 2026 onward) is needed to see AOP Analysis.</p></div></div>`;
    }
    return headerHtml + buildAopAnalysisCore(offtakeAllRows, EMBEDDED_OFFTAKE_TARGET, targetRef, offtakeAopSelectedType, offtakeAopSelectedPlatform, offtakeAopTableMode, offtakeAopComboSort, 'FY2025-26', 'FY2026-27');
  }
}

let comparisonDim = 'aopPort'; // 'aopPort' | 'sku'
let comparisonSearch = '';
let comparisonTopN = 20;

function renderComparison(ref){
  const filtered = applyDimFilters(allRows);
  const dimKey = comparisonDim; // 'aopPort' or 'sku'
  const rowsForCalc = comparisonDim === 'aopPort' ? filtered.filter(r => r.aopPort !== 'Unmapped') : filtered;

  // Months present, chronological, across the full filtered dataset — automatically grows as new months are added
  const months = [...new Set(rowsForCalc.map(r => monthKey(r.date)))].sort();

  // Pivot: dimension value -> { [monthKey]: value, total }
  const pivot = {};
  rowsForCalc.forEach(r => {
    const key = r[dimKey] || '(blank)';
    if(!pivot[key]) pivot[key] = { total: 0 };
    const mk = monthKey(r.date);
    pivot[key][mk] = (pivot[key][mk] || 0) + r.value;
    pivot[key].total += r.value;
  });

  let entries = Object.keys(pivot).map(k => ({ name: k, ...pivot[k] }));
  if(comparisonSearch) entries = entries.filter(e => e.name.toLowerCase().includes(comparisonSearch.toLowerCase()));
  entries.sort((a,b) => b.total - a.total);
  const shown = comparisonTopN === 'all' ? entries : entries.slice(0, comparisonTopN);

  const monthHeaders = months.map(m => {
    const [y,mo] = m.split('-');
    return `<th class="num">${MONTH_NAMES[parseInt(mo)-1]} ${y.slice(2)}</th>`;
  }).join('');

  const rows = shown.map(e => `
    <tr>
      <td style="max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; position:sticky; left:0; background:var(--panel);" title="${e.name}">${e.name}</td>
      ${months.map(m => `<td class="num mono">${e[m] ? '₹'+fmtCr(e[m]) : '—'}</td>`).join('')}
      <td class="num mono" style="font-weight:600;">₹${fmtCr(e.total)}</td>
    </tr>`).join('');

  return `
    <div class="grid-2" style="grid-template-columns: 220px 1fr; align-items:start;">
      <div class="section">
        <div class="section-head"><h2>View by</h2></div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn ${comparisonDim==='aopPort'?'':'ghost'}" data-comparedim="aopPort" style="${comparisonDim==='aopPort'?'':'border:1.5px solid var(--navy); color:var(--navy);'}">AOP Portfolio</button>
          <button class="btn ${comparisonDim==='sku'?'':'ghost'}" data-comparedim="sku" style="${comparisonDim==='sku'?'':'border:1.5px solid var(--navy); color:var(--navy);'}">SKU</button>
        </div>
        <div style="margin-top:16px;">
          <input class="searchbox" id="compareSearch" placeholder="Search…" value="${comparisonSearch}" style="width:100%;" />
        </div>
        <div class="toggle-group" style="margin-top:10px; width:100%;">
          <button class="toggle-btn ${comparisonTopN===20?'active':''}" data-comparetopn="20">Top 20</button>
          <button class="toggle-btn ${comparisonTopN===50?'active':''}" data-comparetopn="50">Top 50</button>
          <button class="toggle-btn ${comparisonTopN==='all'?'active':''}" data-comparetopn="all">All</button>
        </div>
      </div>
      <div class="section">
        <div class="section-head"><h2>${comparisonDim==='aopPort'?'AOP Portfolio':'SKU'} — Month-wise Sales</h2><span class="note">${months.length} month(s) · ${entries.length} ${comparisonDim==='aopPort'?'portfolios':'SKUs'}</span></div>
        ${comparisonDim==='aopPort' ? '<div class="section-sub">Excludes rows with no AOP Portfolio match. New months appear automatically as they\'re uploaded.</div>' : '<div class="section-sub">New months appear automatically as they\'re uploaded.</div>'}
        <div style="overflow-x:auto;">
          <table class="mono">
            <thead><tr><th style="position:sticky; left:0; background:var(--panel);">${comparisonDim==='aopPort'?'AOP Portfolio':'SKU'}</th>${monthHeaders}<th class="num">Total</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="${months.length+2}" style="text-align:center; color:var(--muted); padding:20px;">No data</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderPlatform(ref){
  const ytd = computeYTD(allRows, ref);
  const mtd = computeMTD(allRows, ref);
  const portalYtd = groupAndRank(ytd.rows,'portal', ytd.value);

function groupAndRankFull(rows, dimKey, totalValue){
  const g = {};
  rows.forEach(r => {
    const k = r[dimKey]; if(!k) return;
    if(!g[k]) g[k] = { value:0, qty:0, cv:0 };
    g[k].value += r.value; g[k].qty += r.qty; g[k].cv += r.cv;
  });
  const arr = Object.keys(g).map(k => ({ name:k, value:g[k].value, qty:g[k].qty, cv:g[k].cv }));
  arr.sort((a,b)=>b.value-a.value);
  arr.forEach((a,i) => { a.rank=i+1; a.pct = totalValue ? (a.value/totalValue*100) : 0; });
  return arr;
}

function buildComparisonPeriods(rows, mode, customA, customB){
  if(rows.length === 0) return [];
  const maxDate = rows.reduce((m,r)=> r.date>m?r.date:m, rows[0].date);
  const ly = parseInt(maxDate.slice(0,4),10), lm = parseInt(maxDate.slice(5,7),10);
  if(mode === 'l6m'){
    const periods = [];
    for(let i=5; i>=0; i--){
      let y=ly, m=lm-i;
      while(m<=0){ m+=12; y--; }
      periods.push({ key: `${y}-${String(m).padStart(2,'0')}`, label: `${MONTH_NAMES[m-1]} ${String(y).slice(2)}` });
    }
    return periods;
  }
  if(mode === 'yoy'){
    return [
      { key: `${ly-1}-${String(lm).padStart(2,'0')}`, label: `${MONTH_NAMES[lm-1]} ${String(ly-1).slice(2)}` },
      { key: `${ly}-${String(lm).padStart(2,'0')}`, label: `${MONTH_NAMES[lm-1]} ${String(ly).slice(2)}` }
    ];
  }
  // custom
  const periods = [];
  [customA, customB].forEach(c => {
    if(c){ const [y,m] = c.split('-'); periods.push({ key:c, label:`${MONTH_NAMES[parseInt(m,10)-1]} ${y.slice(2)}` }); }
  });
  return periods;
}

function buildComparisonTableHtml(rowsAll, groupBy){
  const filtered = applyDimFilters(rowsAll);
  const periods = buildComparisonPeriods(filtered, comparisonMode, comparisonCustomA, comparisonCustomB);
  if(periods.length === 0){
    return `<div class="empty"><h3>No data</h3><p>${comparisonMode==='custom' ? 'Pick two months above to compare.' : 'No data available for this dataset yet.'}</p></div>`;
  }

  const combo = {};
  filtered.forEach(r => {
    const pk = r.date.slice(0,7);
    if(!periods.find(p=>p.key===pk)) return;
    const key = groupBy==='sku' ? (r.mg10||r.sku||'(Unassigned)') : (r.aopDiv+'|'+r.aopPort);
    if(!combo[key]) combo[key] = groupBy==='sku' ? { sku:key } : { div:r.aopDiv, port:r.aopPort };
    combo[key][pk] = (combo[key][pk]||0) + r.value;
  });
  let rows = Object.values(combo);
  rows.forEach(row => { row.total = periods.reduce((s,p)=>s+(row[p.key]||0),0); });
  if(comparisonSort === 'name'){
    rows.sort((a,b) => (groupBy==='sku' ? a.sku.localeCompare(b.sku) : (a.div+a.port).localeCompare(b.div+b.port)));
  } else {
    rows.sort((a,b)=>b.total-a.total);
  }

  const grandTotals = periods.map(p => ({ key:p.key, total: rows.reduce((s,r)=>s+(r[p.key]||0),0) }));
  function momCell(curVal, prevVal, isFirst){
    const valHtml = `<div>${curVal ? '₹'+fmtCr(curVal)+' Cr' : '—'}</div>`;
    if(isFirst) return `<td class="num mono">${valHtml}</td>`;
    const momPct = prevVal ? ((curVal-prevVal)/Math.abs(prevVal)*100) : (curVal>0 ? null : null);
    const badge = momPct===null ? '' : `<div class="mom-badge ${momPct>=0?'gap-pos':'gap-neg'}">${momPct>=0?'▲ +':'▼ '}${fmtPct(Math.abs(momPct))}</div>`;
    return `<td class="num mono">${valHtml}${badge}</td>`;
  }

  const theadCols = periods.map(p=>`<th class="num">${p.label}</th>`).join('');
  const labelColSpan = groupBy==='sku' ? 1 : 2;
  const totalsRow = `<tr class="tg-subtotal-row"><td colspan="${labelColSpan}">Total</td>${grandTotals.map((g,i)=>momCell(g.total, i>0?grandTotals[i-1].total:null, i===0)).join('')}</tr>`;
  const tbodyRows = rows.map(row => {
    const labelCell = groupBy==='sku' ? `<td>${row.sku}</td>` : `<td>${row.div}</td><td>${row.port}</td>`;
    return `<tr>
      ${labelCell}
      ${periods.map((p,i)=>momCell(row[p.key]||0, i>0?(row[periods[i-1].key]||0):null, i===0)).join('')}
    </tr>`;
  }).join('');

  const headCols = groupBy==='sku'
    ? `<th style="position:relative;">${columnHeaderFilterHtml('mg10', 'SKU (MG10)', uniqueSorted(rowsAll,'sku').length ? [...new Set(rowsAll.map(r=>r.mg10||r.sku).filter(Boolean))].sort() : [])}</th>`
    : `<th style="position:relative;">${columnHeaderFilterHtml('aopDiv', 'AOP Division', uniqueSorted(rowsAll,'aopDiv'))}</th><th style="position:relative;">${columnHeaderFilterHtml('aopPort', 'AOP Portfolio', uniqueSorted(rowsAll,'aopPort'))}</th>`;
  return `
    <table class="mono">
      <thead><tr>${headCols}${theadCols}</tr></thead>
      <tbody>${totalsRow}${tbodyRows || `<tr><td colspan="${periods.length+labelColSpan}" style="text-align:center; color:var(--muted); padding:20px;">No data</td></tr>`}</tbody>
    </table>
  `;
}

function columnHeaderFilterHtml(key, label, options){
  // Uses a distinct toggle key ("col:X") from the underlying filter field (X) — the same filter can be
  // exposed both here and in the global filter bar, and they need independent open/closed state so
  // clicking one doesn't also pop open the other's panel.
  const toggleKey = 'col:' + key;
  const opts = options.map(o => typeof o === 'string' ? {value:o, label:o} : o);
  const selected = filters[key];
  const isOpen = openFilterKey === toggleKey;
  const isActive = selected.length > 0;
  return `
    <span class="th-filter-wrap">
      ${label}
      <button type="button" class="th-filter-btn ${isActive?'active':''}" data-mseltoggle="${toggleKey}">▾${isActive?` (${selected.length})`:''}</button>
      ${isOpen ? `
      <div class="msel-panel" data-mselpanel="${toggleKey}">
        ${opts.length > 6 ? `<input type="text" class="msel-search" data-mselsearch="${toggleKey}" placeholder="Search…" autocomplete="off" value="${mselSearchQuery.replace(/"/g,'&quot;')}" />` : ''}
        <div class="msel-options-scroll">
          ${opts.length===0 ? '<div class="msel-empty">No values</div>' : opts.map(o => `
            <label class="msel-opt" data-mseloptlabel="${o.label.toLowerCase().replace(/"/g,'&quot;')}">
              <input type="checkbox" data-mselcheck="${key}" value="${o.value.replace(/"/g,'&quot;')}" ${selected.includes(o.value)?'checked':''}/>
              <span>${o.label}</span>
            </label>`).join('')}
        </div>
        <div class="msel-actions">
          <button type="button" class="msel-clearbtn" data-mselclear="${key}">Clear</button>
          <button type="button" class="msel-donebtn" data-mseldone="${toggleKey}">Done</button>
        </div>
      </div>` : ''}
    </span>
  `;
}

function positionOpenMselPanels(){
  // .msel-panel uses position:fixed so it can never be clipped by an ancestor's overflow (e.g. the
  // filter bar's horizontal scroll). Uses the anchor rect captured at the moment of the actual click,
  // rather than re-querying by key — the same filter key can appear in more than one place on a page
  // (e.g. the global filter bar AND an Excel-style column header both filtering "AOP Division"), and
  // re-querying would always find the first match instead of the one actually clicked.
  if(!openFilterAnchorRect) return;
  document.querySelectorAll('[data-mselpanel]').forEach(panel => {
    const panelWidth = panel.offsetWidth || 220;
    let left = openFilterAnchorRect.left;
    if(left + panelWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - panelWidth - 8);
    panel.style.top = (openFilterAnchorRect.bottom + 4) + 'px';
    panel.style.left = left + 'px';
  });
}

function wireGlobalEvents(){
  positionOpenMselPanels();
  const fi = document.getElementById('fileInput');
  if(fi) fi.addEventListener('change', handleFile);
  const gdriveBtn = document.getElementById('gdriveFetchBtn');
  if(gdriveBtn) gdriveBtn.addEventListener('click', refreshBothFromDrive);

  if(gdriveChangeKey) gdriveChangeKey.addEventListener('click', () => { getGdriveApiKey(true); });
  const resetAll = document.getElementById('resetAllBtn');
  if(resetAll) resetAll.addEventListener('click', async () => {
    if(!confirm('Remove ALL uploaded sales data from this dashboard for everyone? This cannot be undone.')) return;
    // Previously this only cleared "salesrows:" (Primary Sales) keys — "offtakerows:" (Offtakes) keys
    // were never touched at all, meaning Offtakes data could never actually be cleared through this
    // button since the day live Offtakes fetching was added. Both need to be cleared for a real reset.
    const salesList = await window.storage.list('salesrows:', true);
    if(salesList && salesList.keys) for(const k of salesList.keys) await window.storage.delete(k, true);
    const offtakeList = await window.storage.list('offtakerows:', true);
    if(offtakeList && offtakeList.keys) for(const k of offtakeList.keys) await window.storage.delete(k, true);
    await refreshRawRows();
    recomputeAllRows();
    await refreshOfftakeRows();
    enrichOfftakeRows();
    filters = { fy:[], month:[], portal:[], portalType:[], kam:[], aopDiv:[], aopPort:[], mg09:[], mg10:[], billingFrom:'', billingTo:'' };
    render();
  });
  document.querySelectorAll('[data-page]').forEach(btn => {
    btn.addEventListener('click', () => { currentPage = btn.getAttribute('data-page'); openFilterKey = null; render(); });
  });
  document.querySelectorAll('[data-mseltoggle]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-mseltoggle');
      if(openFilterKey === key){
        openFilterKey = null;
        openFilterAnchorRect = null;
      } else {
        openFilterKey = key;
        mselSearchQuery = '';
        const r = btn.getBoundingClientRect();
        openFilterAnchorRect = { top:r.top, bottom:r.bottom, left:r.left };
      }
      render();
    });
  });
  function applyMselSearchFilter(input){
    const query = input.value.trim().toLowerCase();
    mselSearchQuery = input.value;
    const panel = input.closest('.msel-panel');
    if(!panel) return;
    panel.querySelectorAll('[data-mseloptlabel]').forEach(opt => {
      const label = opt.getAttribute('data-mseloptlabel') || '';
      opt.style.display = (!query || label.includes(query)) ? '' : 'none';
    });
  }
  document.querySelectorAll('[data-mselsearch]').forEach(input => {
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('input', () => applyMselSearchFilter(input));
    if(mselSearchQuery) applyMselSearchFilter(input); // re-apply after a re-render (e.g. checkbox click) while typing
    input.focus();
    const v = input.value; input.value = ''; input.value = v; // move caret to the end after refocus
  });
  document.querySelectorAll('[data-mselcheck]').forEach(cb => {
    cb.addEventListener('change', () => {
      const key = cb.getAttribute('data-mselcheck');
      const val = cb.value;
      const arr = filters[key];
      const idx = arr.indexOf(val);
      if(cb.checked && idx===-1) arr.push(val);
      else if(!cb.checked && idx!==-1) arr.splice(idx,1);
      render();
    });
  });
  document.querySelectorAll('[data-mselclear]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = btn.getAttribute('data-mselclear');
      if(key === 'billingDate'){ filters.billingFrom = ''; filters.billingTo = ''; }
      else{ filters[key] = []; }
      render();
    });
  });
  document.querySelectorAll('[data-mseldone]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openFilterKey = null;
      render();
    });
  });
  document.querySelectorAll('[data-mselpanel]').forEach(panel => {
    panel.addEventListener('click', (e) => e.stopPropagation());
  });
  const billingFromInput = document.getElementById('billingFromInput');
  if(billingFromInput) billingFromInput.addEventListener('change', () => { filters.billingFrom = billingFromInput.value; render(); });
  const billingToInput = document.getElementById('billingToInput');
  if(billingToInput) billingToInput.addEventListener('change', () => { filters.billingTo = billingToInput.value; render(); });
  const resetF = document.getElementById('resetFiltersBtn');
  if(resetF) resetF.addEventListener('click', () => { filters = { fy:[], month:[], portal:[], portalType:[], kam:[], aopDiv:[], aopPort:[], mg09:[], mg10:[], billingFrom:'', billingTo:'' }; openFilterKey = null; render(); });
  document.querySelectorAll('[data-clearpill]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-clearpill');
      if(key === 'billingRange'){ filters.billingFrom = ''; filters.billingTo = ''; }
      else{
        const val = btn.getAttribute('data-clearval');
        filters[key] = filters[key].filter(v => v !== val);
      }
      render();
    });
  });
  if(!window.__mselOutsideClickBound){
    window.__mselOutsideClickBound = true;
    document.addEventListener('click', () => {
      if(openFilterKey !== null){ openFilterKey = null; render(); }
    });
  }
}

// Unlike Google Drive, Microsoft Graph has no "API key only" path — every access needs a real OAuth sign-in,
// even for a folder shared as "Anyone with the link." This means a Microsoft sign-in popup each browser session.
const ONEDRIVE_SHARE_LINK = 'https://hygienic-my.sharepoint.com/:f:/g/personal/gautam_c_hriindia_com/IgA2jc7tZpJVQa8UjwRVhAy3Ae2lpxB5TyORxr8dgW2lr50?e=lXPf8u';

function getOneDriveConfig(forceAsk){
  let clientId = localStorage.getItem('onedrive_client_id') || '';
  let tenantId = localStorage.getItem('onedrive_tenant_id') || '';
  if(!clientId || !tenantId || forceAsk){
    const enteredClientId = prompt('One-time setup: paste your Azure AD App Client ID (see README for how to get one):', clientId);
    if(!enteredClientId || !enteredClientId.trim()) return null;
    clientId = enteredClientId.trim();
    const enteredTenantId = prompt('Now paste your Azure AD Tenant ID or domain (e.g. hriindia.com):', tenantId || 'hriindia.com');
    if(!enteredTenantId || !enteredTenantId.trim()) return null;
    tenantId = enteredTenantId.trim();
    localStorage.setItem('onedrive_client_id', clientId);
    localStorage.setItem('onedrive_tenant_id', tenantId);
  }
  return { clientId, tenantId };
}

let msalInstance = null;
async function getOneDriveToken(clientId, tenantId){
  if(!msalInstance){
    msalInstance = new msal.PublicClientApplication({
      auth: { clientId, authority: `https://login.microsoftonline.com/${tenantId}` }
    });
    await msalInstance.initialize();
  }
  const request = { scopes: ['Files.Read'] };
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length > 0){
    try{
      const silent = await msalInstance.acquireTokenSilent({ ...request, account: accounts[0] });
      return silent.accessToken;
    }catch(e){ /* falls through to interactive sign-in below */ }
  }
  const result = await msalInstance.loginPopup(request);
  return result.accessToken;
}

function encodeSharingUrl(url){
  const base64 = btoa(unescape(encodeURIComponent(url)))
    .replace(/=+$/,'').replace(/\//g,'_').replace(/\+/g,'-');
  return 'u!' + base64;
}

async function connectAndFetchOneDrive(){
  const config = getOneDriveConfig(false);
  if(!config) return;

  const btn = document.getElementById('onedriveFetchBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  try{
    if(typeof msal === 'undefined') throw new Error('Microsoft sign-in library failed to load — check your internet connection and reload.');
    const token = await getOneDriveToken(config.clientId, config.tenantId);

    btn.textContent = 'Finding latest file…';
    const shareId = encodeSharingUrl(ONEDRIVE_SHARE_LINK);
    const itemRes = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareId}/driveItem?$expand=children`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if(!itemRes.ok){
      const errBody = await itemRes.text();
      throw new Error(`Graph API error (${itemRes.status}). Check the app has Files.Read permission granted, and the folder is still shared. Details: ${errBody.slice(0,200)}`);
    }
    const itemData = await itemRes.json();
    const children = itemData.children || [];
    const match = children
      .filter(f => f.name && /\.(xlsx|xls)$/i.test(f.name))
      .sort((a,b) => new Date(b.lastModifiedDateTime) - new Date(a.lastModifiedDateTime))[0];
    if(!match) throw new Error('No .xls or .xlsx file found in that OneDrive folder.');

    btn.textContent = 'Downloading "' + match.name + '"…';
    const downloadUrl = match['@microsoft.graph.downloadUrl'];
    if(!downloadUrl) throw new Error('File found but no download link was returned by Graph API.');
    const fileRes = await fetch(downloadUrl);
    if(!fileRes.ok) throw new Error(`Could not download the file (${fileRes.status}).`);
    const buf = await fileRes.arrayBuffer();
    const wb = readWorkbookSmart(buf);
    const result = parseSalesFile(wb);
    if(result.rows.length===0) throw new Error('No valid transaction rows found in the file.');
    const months = await saveRowsByMonth(result.rows);
    await refreshRawRows();
    recomputeAllRows();
    render();
    showBanner(`Loaded "${match.name}" (modified ${new Date(match.lastModifiedDateTime).toLocaleString()}) — ${result.rows.length} rows across ${months.length} month(s).`, 'ok');
  }catch(err){
    showBanner('OneDrive fetch failed: ' + err.message, 'err');
  }finally{
    const b = document.getElementById('onedriveFetchBtn');
    if(b){ b.disabled = false; b.textContent = '↻ Refresh from OneDrive'; }
  }
}

function getGdriveApiKey(forceAsk){
  let key = localStorage.getItem('gdrive_api_key') || '';
  if(!key && !forceAsk){
    return DEFAULT_GDRIVE_API_KEY;
  }
  if(!key || forceAsk){
    const entered = prompt('Paste your Google API key (leave blank + OK to use the shared default key):', key || DEFAULT_GDRIVE_API_KEY);
    if(entered && entered.trim()){

// Fetches ONLY the latest matching file from a folder — used for Primary Sales, which always ships as
// a single "here is the current full report" file, not a set of files to merge together.
async function fetchLatestFileFromDriveFolder(apiKey, folderId, btn, label){
  const cacheBust = Date.now();
  // Cache-busting: without this, if you EDIT/REPLACE content inside the same Drive file rather than
  // creating a new one, the file's ID never changes — and the browser can silently serve a stale cached
  // copy of that same URL forever, ignoring the real updated content on Drive's servers. `cache:'no-store'`
  // plus a unique timestamp query param force every click to hit the network fresh, permanently.
  const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
  const listRes = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=25&fields=files(id,name,modifiedTime)&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
    { cache: 'no-store' }
  );
  if(!listRes.ok){
    const errBody = await listRes.text();
    throw new Error(`Drive API error (${listRes.status}). Check that the API key is valid, Drive API is enabled, and the folder is shared as "Anyone with the link." Details: ${errBody.slice(0,200)}`);
  }
  const listData = await listRes.json();
  const match = (listData.files||[]).find(f => /\.(xlsx|xls)$/i.test(f.name));
  if(!match) throw new Error(`No .xls or .xlsx file found in the ${label} folder (or the folder/files are not shared as "Anyone with the link").`);

  if(btn) btn.textContent = `Downloading "${match.name}"…`;
  const fileRes = await fetch(
    `https://www.googleapis.com/drive/v3/files/${match.id}?alt=media&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
    { cache: 'no-store' }
  );
  if(!fileRes.ok) throw new Error(`Could not download "${match.name}" (${fileRes.status}).`);
  const buf = await fileRes.arrayBuffer();
  return { name: match.name, modifiedTime: match.modifiedTime, buf };
}


async function refreshPrimaryFromDrive(apiKey, btn){
  btn.textContent = 'Finding latest primary sales file…';
  const file = await fetchLatestFileFromDriveFolder(apiKey, GDRIVE_FOLDER_ID, btn, 'primary sales');
  const wb = readWorkbookSmart(file.buf);
  const result = parseSalesFile(wb);
  if(result.rows.length===0) throw new Error('No valid transaction rows found in the file.');
  const months = await saveRowsByMonth(result.rows);

}

// Offtakes ship as monthly files (e.g. "Ecomm Aug'26 offtakes.xlsx", "Ecomm Sep_26 offtakes.xlsx"), so
// ALL .xlsx/.xls files in the folder are loaded, oldest-modified first. Data is stored one key per
// month and a save REPLACES that month, so processing oldest -> newest means: different months from
// different files all coexist, and if the same month appears in two files the most recently modified
// file wins. Nothing is ever added on top of an existing month, so there is no double counting.
async function refreshOfftakesFromDrive(apiKey, btn){
  btn.textContent = 'Listing offtake files…';
  const cacheBust = Date.now();
  const q = encodeURIComponent(`'${OFFTAKE_GDRIVE_FOLDER_ID}' in parents and trashed = false`);
  const listRes = await fetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime)&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
    { cache: 'no-store' }
  );
  if(!listRes.ok){
    const errBody = await listRes.text();
    throw new Error(`Drive API error (${listRes.status}). Check that the API key is valid, Drive API is enabled, and the folder is shared as "Anyone with the link." Details: ${errBody.slice(0,200)}`);
  }
  const listData = await listRes.json();
  const files = (listData.files||[]).filter(f => /\.(xlsx|xls)$/i.test(f.name) && !/^~\$/.test(f.name))
    .sort((a,b) => new Date(a.modifiedTime) - new Date(b.modifiedTime)); // oldest first, newest last (newest wins per month)
  if(files.length === 0) throw new Error('No .xls or .xlsx file found in the offtakes folder (or the folder/files are not shared as "Anyone with the link").');

  const loaded = [], skipped = [];
  const monthsSeen = new Set();
  let totalRows = 0;
  for(let i=0;i<files.length;i++){
    const f = files[i];
    try{
      btn.textContent = `Downloading offtakes ${i+1}/${files.length}: "${f.name}"…`;
      const fileRes = await fetch(
        `https://www.googleapis.com/drive/v3/files/${f.id}?alt=media&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
        { cache: 'no-store' }
      );
      if(!fileRes.ok) throw new Error(`download failed (${fileRes.status})`);
      const buf = await fileRes.arrayBuffer();
      const result = parseOfftakeFile(readWorkbookSmart(buf));
      if(result.rows.length === 0) throw new Error('no valid offtake rows');
      const months = await saveOfftakeRowsByMonth(result.rows);
      months.forEach(m => monthsSeen.add(m));
      totalRows += result.rows.length;
      loaded.push(`"${f.name}" (${result.rows.length} rows: ${months.join(', ')})`);
    }catch(e){
      skipped.push(`"${f.name}" — ${e.message}`);
    }
  }
  if(loaded.length === 0) throw new Error('None of the files in the offtakes folder could be read as offtake data. ' + skipped.join('; '));
  await refreshOfftakeRows();
  enrichOfftakeRows();
  return `Offtakes: loaded ${loaded.length} file(s), ${totalRows} rows across ${monthsSeen.size} month(s) — ${loaded.join('; ')}` +
    (skipped.length ? ` · Skipped: ${skipped.join('; ')}` : '');
}

async function getStorageUsageDescription(){
  // Modern browsers expose an actual usage/quota estimate for the whole origin (covering
  // IndexedDB and everything else) via the Storage API — far more accurate than manually summing
  // localStorage now that the real data lives in IndexedDB instead.
  if(navigator.storage && navigator.storage.estimate){
    try{
      const { usage, quota } = await navigator.storage.estimate();
      const usageMB = (usage/(1024*1024)).toFixed(1);
      const quotaMB = quota ? (quota/(1024*1024)).toFixed(0) : '?';
      return `storage in use: ~${usageMB} MB of ~${quotaMB} MB available`;
    }catch(e){ /* fall through to the simpler estimate below */ }
  }
  let total = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    const v = localStorage.getItem(k);
    total += (k?k.length:0) + (v?v.length:0);
  }
  return `localStorage in use: ~${(total/(1024*1024)).toFixed(2)} MB`;
}

async function refreshBothFromDrive(){
  const apiKey = getGdriveApiKey(false);
  if(!apiKey) return;

  const btn = document.getElementById('gdriveFetchBtn');
  btn.disabled = true;

  const parts = [];
  let hadError = false;

  try{
    parts.push(await refreshPrimaryFromDrive(apiKey, btn));
  }catch(err){
    parts.push('Primary Sales fetch failed: ' + err.message);
    hadError = true;
  }

  try{
    parts.push(await refreshOfftakesFromDrive(apiKey, btn));
  }catch(err){
    parts.push('Offtakes fetch failed: ' + err.message);
    hadError = true;
  }

  parts.push(`(${await getStorageUsageDescription()})`);

  render();
  showBanner(parts.join('  •  '), hadError ? 'err' : 'ok');
  btn.disabled = false;
  btn.textContent = '↻ Refresh from Drive';
}

function getHistoricalFolderId(forceAsk){
  let folderId = localStorage.getItem('gdrive_historical_folder_id') || '';
  if(!folderId || forceAsk){
    const entered = prompt('Paste your historical-data Google Drive folder link or ID (this can be a different folder than your daily upload one):', folderId);
    if(!entered || !entered.trim()) return null;
    // Accept either a raw folder ID or a full Drive URL and extract the ID either way
    const trimmed = entered.trim();
    const urlMatch = trimmed.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    folderId = urlMatch ? urlMatch[1] : trimmed;
    localStorage.setItem('gdrive_historical_folder_id', folderId);
  }
  return folderId;
}

async function importHistoricalFromDrive(){
  const apiKey = getGdriveApiKey(false);
  if(!apiKey) return;
  const folderId = getHistoricalFolderId(false);
  if(!folderId) return;

  const btn = document.getElementById('importHistoricalBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Finding historical files…';

  try{
    const cacheBust = Date.now();
    const q = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
    const listRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime)&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
      { cache: 'no-store' }
    );
    if(!listRes.ok){
      const errBody = await listRes.text();
      throw new Error(`Drive API error (${listRes.status}). Check the API key, and that this folder is shared as "Anyone with the link." Details: ${errBody.slice(0,200)}`);
    }
    const listData = await listRes.json();
    const files = (listData.files||[]).filter(f => /\.(xlsx|xls)$/i.test(f.name));
    if(files.length === 0) throw new Error('No .xls or .xlsx files found in that historical folder.');

    let allNewRows = [];
    let processed = 0, failed = [];
    for(const file of files){
      processed++;
      btn.textContent = `Processing ${processed}/${files.length}: ${file.name}…`;
      try{
        const fileRes = await fetch(
          `https://www.googleapis.com/drive/v3/files/${file.id}?alt=media&key=${encodeURIComponent(apiKey)}&_=${cacheBust}`,
          { cache: 'no-store' }
        );
        if(!fileRes.ok) throw new Error(`HTTP ${fileRes.status}`);
        const buf = await fileRes.arrayBuffer();
        const wb = readWorkbookSmart(buf);
        const result = parseSalesFile(wb);
        allNewRows = allNewRows.concat(result.rows);
      }catch(fileErr){
        failed.push(`${file.name} (${fileErr.message})`);
      }
    }

    if(allNewRows.length === 0) throw new Error('None of the files in that folder could be read. ' + (failed.length ? 'Errors: ' + failed.join('; ') : ''));

    btn.textContent = 'Saving…';
    const months = await saveRowsByMonth(allNewRows);
    await refreshRawRows();
    recomputeAllRows();
    render();
    const failNote = failed.length ? ` ${failed.length} file(s) failed: ${failed.join('; ')}.` : '';
    showBanner(`Imported ${processed - failed.length}/${files.length} historical file(s) — ${allNewRows.length} rows across ${months.length} month(s).${failNote}`, failed.length ? 'warn' : 'ok');
  }catch(err){
    showBanner('Historical import failed: ' + err.message, 'err');
  }finally{
    const b = document.getElementById('importHistoricalBtn');
    if(b) b.textContent = originalText;
  }
}

async function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const buf = await file.arrayBuffer();
    const wb = readWorkbookSmart(buf);
    const result = parseSalesFile(wb);
    if(result.rows.length===0) throw new Error('No valid transaction rows found in the file.');
    const months = await saveRowsByMonth(result.rows);
    await refreshRawRows();
    recomputeAllRows();
    render();
    showBanner(`Loaded ${result.rows.length} rows across ${months.length} month(s) (${months.join(', ')}). Skipped ${result.skippedTotalRow} total/blank row(s).`, 'ok');
  }catch(err){
    showBanner('Could not read this file: ' + err.message, 'err');
  }finally{
    e.target.value = '';
  }
}

  const loadStart = Date.now();
  try{ await refreshRawRows(); }catch(e){ rawRows = []; }
  customerMapper = { map: EMBEDDED_CUSTOMER_MAP, count: Object.keys(EMBEDDED_CUSTOMER_MAP).length };
  aopMapper = { map: EMBEDDED_AOP_MAP, count: Object.keys(EMBEDDED_AOP_MAP).length };

  try{ await refreshOfftakeRows(); }catch(e){ offtakeAllRows = []; }
  enrichOfftakeRows();
  render();
  const MIN_LOADER_MS = 1400;
  const elapsed = Date.now() - loadStart;
  setTimeout(() => {
    const overlay = document.getElementById('loadingOverlay');
    if(overlay){
      overlay.classList.add('hide');
      setTimeout(() => overlay.remove(), 500);
    }
  }, Math.max(MIN_LOADER_MS - elapsed, 0));
}
init();
